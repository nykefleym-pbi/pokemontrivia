name: Deploy Edge Function

# Manual only -- nothing here fires on push or PR. Deploys are reviewed and
# triggered by hand from the Actions tab ("Run workflow"), same discipline as
# every other risky/hard-to-reverse step in this repo's Live PvP refactor.
on:
  workflow_dispatch:
    inputs:
      function_name:
        description: "Edge Function to deploy (directory name under supabase/functions/)"
        required: true
        default: "pvp-live-resolve-turn"
      project_ref:
        description: "Supabase project ref"
        required: true
        default: "dvdorceiasaipdvyfhil"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Bundle the function
        run: node scripts/bundle-edge-function.mjs "${{ inputs.function_name }}"

      # supabase functions deploy only looks inside the function's own
      # directory -- it can't see index.ts's real relative imports into
      # ../../../src/**. Swap the self-contained bundle in as the deploy
      # entrypoint (this checkout is thrown away after the job; the repo's
      # real index.ts on disk is never touched).
      - name: Use the bundle as the deploy entrypoint
        run: cp "supabase/functions/${{ inputs.function_name }}/.bundle.ts" "supabase/functions/${{ inputs.function_name }}/index.ts"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy "${{ inputs.function_name }}" \
            --project-ref "${{ inputs.project_ref }}" \
            --use-api
